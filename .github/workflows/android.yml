name: Android APK
on:
  push:
    paths: ['android/**', 'flags/**', 'archive/**', '*.json', 'ARCHIVE-SOURCES.md', 'tools/*android*', 'tools/build-apk.sh', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'flags/**', 'archive/**', '*.json', 'ARCHIVE-SOURCES.md', 'tools/*android*', 'tools/build-apk.sh', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
      - name: Install native build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Test cloth engine
        run: bash tools/test-cloth.sh
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flagwave-android-debug-key-v1
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlagWave-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
