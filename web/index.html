<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1418"><title>FlagWave</title><meta name="description" content="The FlagWave Android experience on the web: 424 offline-ready flag designs, waving 3D ASCII cloth, orbit controls and image imports."><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><div id="app" data-layout="android">
<header><span class="wordmark">FlagWave</span><div class="header-actions"><button id="layout-mode" class="text-button" aria-label="Change layout mode">Auto</button><button class="icon-button" data-action="info" aria-label="Flag details" data-icon="info"></button></div></header>
<nav aria-label="Main navigation"><button data-tab="stage" class="nav-item active"><span data-icon="waves"></span><span>Stage</span></button><button data-tab="library" class="nav-item"><span data-icon="flag"></span><span>Library</span></button><button data-tab="controls" class="nav-item"><span data-icon="tune"></span><span>Controls</span></button><div class="rail-note">3D ASCII<br>cloth</div></nav>
<main><section id="stage" class="view stage-view"><div class="stage-heading"><div><div id="live-label" class="eyebrow">LIVE CANVAS</div><h1 id="flag-name">Red Eureka</h1></div><button id="stage-favourite" class="icon-button favourite-button" data-action="favourite" aria-label="Toggle favourite" data-icon="heart"></button></div><div class="canvas-card"><canvas id="flag-canvas" aria-label="Waving three-dimensional flag. Drag to rotate, pinch or scroll to zoom." tabindex="0"></canvas><div id="render-error" class="render-error" hidden></div><button class="icon-button tonal floating-fullscreen" data-action="fullscreen" aria-label="Toggle fullscreen" data-icon="fullscreen"></button><button class="icon-button tonal fullscreen-pause" data-action="pause" aria-label="Pause animation" data-icon="pause"></button></div><p class="gesture-hint">Drag to orbit · Pinch to zoom · Double-tap to reset</p><div class="stage-actions"><button class="icon-button primary pause-button" data-action="pause" aria-label="Pause animation" data-icon="pause"></button><button id="orbit-toggle" class="tonal orbit-button" data-action="orbit"><span data-icon="orbit"></span><span>Orbit on</span></button><button class="icon-button tonal" data-action="sheet" aria-label="Motion and appearance" data-icon="tune"></button></div></section>
<section id="library" class="view" hidden><div class="library-heading"><div><h1>Find your flag</h1><p id="library-count">424 designs. Your perspective.</p></div><button class="tonal import-button" data-action="import"><span data-icon="add"></span>Import</button></div><div class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search flags, eras, ideologies…" aria-label="Search flags"></div><div id="categories" class="chips" aria-label="Flag categories"></div><div id="flag-grid" class="flag-grid"></div></section>
<section id="controls" class="view controls-view" hidden><h1>Make it yours</h1><p class="subtitle">A little wind. A different perspective.</p><div id="page-controls" class="controls-body"></div></section></main>
<aside id="inspector"><h2>Motion & appearance</h2><div id="desktop-controls" class="controls-body"></div></aside>
<dialog id="controls-sheet" class="bottom-sheet"><div class="sheet-grip"></div><div class="dialog-heading"><h2>Motion & appearance</h2><button class="icon-button" data-action="close-sheet" aria-label="Close controls" data-icon="close"></button></div><div id="sheet-controls" class="controls-body"></div></dialog>
<dialog id="info-dialog"><div class="dialog-heading"><h2 id="info-title"></h2><button class="icon-button" data-action="close-info" aria-label="Close details" data-icon="close"></button></div><div id="info-body"></div><button class="text-button done" data-action="close-info">Done</button></dialog>
<input id="image-import" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" multiple hidden><div id="toast" role="status" aria-live="polite"></div>
</div><script type="module" src="app.js"></script></body></html>
